name: Atualizar ZvZ (a cada 6 horas)
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: true
      - name: Buscar lutas
        run: python3 tools/atualizar_zvz.py 2>&1 | tee /tmp/zvz.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Mostrar o fim do log se falhou
        if: failure()
        run: echo "::error::$(grep -v '^::' /tmp/zvz.log | tail -c 700 | tr '\n' ' ')"
      - name: Atualizar a versão dos arquivos e publicar se mudou
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "zvz-bot"
            git config user.email "zvz-bot@users.noreply.github.com"
            git add -A data
            git commit -m "ZvZ atualizado automaticamente"
            for i in 1 2 3; do
              git pull --rebase -X theirs -q || git rebase --abort
              ./carimbo.sh
              git add -A index.html versao.txt versao.json
              git commit --amend --no-edit -q || true
              git push && break || sleep 5
            done
          fi
