name: Atualizar ZvZ (a cada 6 horas)
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: true
      - run: python3 tools/atualizar_zvz.py
      - name: Atualizar a versão dos arquivos e publicar se mudou
        run: |
          ./carimbo.sh
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "zvz-bot"
            git config user.email "zvz-bot@users.noreply.github.com"
            git add data/zvz.json index.html
            git commit -m "ZvZ atualizado automaticamente"
            git pull --rebase -q; git push
          fi
