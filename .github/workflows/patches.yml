name: Atualizar patch notes (diário)
# Os patches do Albion saem no fórum oficial entre 10:00 e 10:50 UTC (medido em Patch 2, 3, 4 e hotfixes).
# 12:47 UTC deixa mais de 1 hora de folga depois da publicação mais tardia.
on:
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler as notas oficiais
        run: python3 tools/atualizar_patch.py 2>&1 | tee /tmp/patch.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Mostrar o fim do log se falhou
        if: failure()
        run: echo "::error::$(grep -v '^::' /tmp/patch.log | tail -c 700 | tr '\n' ' ')"
      - name: Atualizar a versão dos arquivos e publicar se mudou
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "patch-bot"
            git config user.email "patch-bot@users.noreply.github.com"
            git add -A data
            git commit -m "Patch notes atualizados automaticamente"
            for i in 1 2 3; do
              git pull --rebase -X theirs -q || git rebase --abort
              ./carimbo.sh
              git add -A index.html versao.txt versao.json
              git commit --amend --no-edit -q || true
              git push && break || sleep 5
            done
          fi
