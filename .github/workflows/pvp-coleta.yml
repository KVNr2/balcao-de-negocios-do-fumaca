name: Coletar mortes do Albion (a cada 15 min)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pvp-dados
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Branch de dados
        run: |
          H=$(date -u +%F); O=$(date -u -d yesterday +%F)
          if git fetch origin pvp-dados 2>/dev/null; then
            git worktree add --no-checkout dados origin/pvp-dados
            git -C dados sparse-checkout set --no-cone /perfis.json "/eventos/$H.jsonl.gz" "/eventos/$O.jsonl.gz"
            git -C dados checkout
          else
            git worktree add --detach dados; cd dados; git checkout --orphan pvp-dados; git rm -rf . -q
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/coletar_pvp.py dados
      - name: Guardar (um commit só, sem histórico)
        working-directory: dados
        run: |
          git config user.name "pvp-bot"; git config user.email "pvp-bot@users.noreply.github.com"
          git add -A; git commit -q --amend -m "mortes coletadas" 2>/dev/null || git commit -q -m "mortes coletadas"
          git push --force-with-lease origin HEAD:pvp-dados
