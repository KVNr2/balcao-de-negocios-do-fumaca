name: Coletar mortes do Albion (ciclos de 15 min)
# O agendamento do GitHub atrasa ou pula execuções (na prática saía a cada 30-45 min).
# Por isso cada execução dura ~1 hora e faz 4 coletas, uma a cada 15 minutos exatos;
# o cron horário deixa sempre a próxima execução na fila (concurrency), então não há buraco.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pvp-dados
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quatro coletas, uma a cada 15 minutos
        run: |
          INI=$(date +%s)
          for i in 0 1 2 3; do
            ALVO=$((INI + i*900)); AGORA=$(date +%s)
            [ "$ALVO" -gt "$AGORA" ] && sleep $((ALVO-AGORA))
            echo "::group::coleta $((i+1)) de 4 ($(date -u +%H:%M))"
            bash tools/coleta_ciclo.sh || true
            echo "::endgroup::"
          done
          FIM=$((INI + 3600)); AGORA=$(date +%s)
          [ "$FIM" -gt "$AGORA" ] && sleep $((FIM-AGORA))
          exit 0
