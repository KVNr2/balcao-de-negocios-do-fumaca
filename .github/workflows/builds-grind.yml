name: Atualizar builds (diário)
on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/atualizar_builds.py
      - name: Atualizar a versão dos arquivos e publicar se mudou
        run: |
          ./carimbo.sh
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "builds-bot"
            git config user.email "builds-bot@users.noreply.github.com"
            git add data/builds-grind.json index.html versao.txt
            git commit -m "Builds atualizadas automaticamente"
            git pull --rebase -q
            git push
          fi
