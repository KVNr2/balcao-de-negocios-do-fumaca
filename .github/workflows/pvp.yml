name: Atualizar PVP (todo dia)
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar e classificar as mortes
        run: python3 tools/atualizar_pvp.py 2>&1 | tee /tmp/pvp.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Mostrar o fim do log se falhou
        if: failure()
        run: echo "::error::$(grep -v '^::' /tmp/pvp.log | tail -c 700 | tr '\n' ' ')"
      - name: Atualizar a versão dos arquivos e publicar se mudou
        run: |
          ./carimbo.sh
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "pvp-bot"
            git config user.email "pvp-bot@users.noreply.github.com"
            git add -A data index.html versao.txt versao.json
            git commit -m "PVP atualizado automaticamente"
            for i in 1 2 3; do
              git pull --rebase -X theirs -q || git rebase --abort
              ./carimbo.sh
              git add -A index.html versao.txt versao.json
              git commit --amend --no-edit -q || true
              git push && break || sleep 5
            done
          fi
