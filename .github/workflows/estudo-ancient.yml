name: Coletar material do estudo Ancient Lands (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  estudo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/coletar_estudo.py
      - name: Publicar
        if: always()
        run: |
          git config user.name pvp-bot; git config user.email pvp-bot@users.noreply.github.com
          git add tools/estudo-ancient.json.gz; git commit -q -m "Material do estudo de Ancient Lands" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
