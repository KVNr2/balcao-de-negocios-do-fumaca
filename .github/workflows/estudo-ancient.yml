name: Coletar material do estudo Ancient Lands (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  estudo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: PedroAugusto92/albion-overlay
          token: ${{ secrets.PRIVADO_TOKEN }}
          path: .privado
          sparse-checkout: site/tools
      - run: rm -rf tools && cp -r .privado/site/tools tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/coletar_estudo.py
      - name: Publicar
        if: always()
        run: |
          cd .privado && git config user.name pvp-bot && git config user.email pvp-bot@users.noreply.github.com
          for a in estudo-ancient.json.gz; do [ -f "../tools/$a" ] && cp "../tools/$a" "site/tools/$a"; done
          git add site/tools/estudo-ancient.json.gz; git commit -q -m "Material do estudo de Ancient Lands" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
