name: Atualizar composições (diário)
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python3 tools/atualizar_comps.py
      - name: Atualizar a versão dos arquivos e publicar se mudou
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "comps-bot"
            git config user.email "comps-bot@users.noreply.github.com"
            git add -A data
            git commit -m "Composições atualizadas automaticamente"
            for i in 1 2 3; do
              git pull --rebase -X theirs -q || git rebase --abort
              ./carimbo.sh
              git add -A index.html versao.txt versao.json
              git commit --amend --no-edit -q || true
              git push && break || sleep 5
            done
          fi
