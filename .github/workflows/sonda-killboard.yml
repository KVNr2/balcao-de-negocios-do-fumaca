name: Sonda do killboard (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: PedroAugusto92/albion-overlay
          token: ${{ secrets.PRIVADO_TOKEN }}
          path: .privado
          sparse-checkout: site/tools
      - run: rm -rf tools && cp -r .privado/site/tools tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/sonda_perfil.py
      - name: Publicar o resultado
        run: |
          cd .privado && git config user.name sonda-bot && git config user.email sonda-bot@users.noreply.github.com
          for a in sonda-perfil.json; do [ -f "../tools/$a" ] && cp "../tools/$a" "site/tools/$a"; done
          git add site/tools/sonda-perfil.json; git commit -q -m "Sonda do killboard" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
