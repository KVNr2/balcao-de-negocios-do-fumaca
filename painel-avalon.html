<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Avalon do Albion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/balcao.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--night);color:var(--parch);font:15px/1.4 var(--f-body);cursor:default;display:block}
.pa{height:100%;display:flex;flex-direction:column;box-sizing:border-box;background:var(--cloth);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pa-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--cloth-2);border-bottom:1px solid var(--line);user-select:none;cursor:move}
.pa-bar b{flex:1;text-align:center;font:600 14px var(--f-display);color:var(--parch-2,var(--parch));letter-spacing:.02em}
.pa-bar button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--smoke);font-size:16px}
.pa-bar button:hover,.pa-bar button:focus-visible{background:var(--night-2);color:var(--saffron)}
.pa-corpo{flex:1;min-height:0;overflow:auto;padding:14px 16px 16px}
/* mesmo formato da janela do mapa no site: cabeçalho com tier e tipo em destaque; mapa grande à esquerda; à direita o que tem no mapa e depois os recursos */
.pa-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pa-hd>img{width:36px;height:36px;flex:none}
.pa-tt{flex:1;min-width:0}
.pa-nome{margin:0;font:600 22px/1.15 var(--f-display);color:var(--parch)}
.pa-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.tag{display:inline-block;padding:6px 12px;border-radius:999px;font:700 15px/1 var(--f-body);color:var(--parch);background:color-mix(in srgb,currentColor 18%,transparent);border:1px solid color-mix(in srgb,currentColor 55%,transparent)}
.tag.t4{color:#8fd19a}.tag.t5{color:#7fb6e8}.tag.t6{color:#e6c56a}.tag.t7{color:#d79ae0}.tag.t8{color:#e58b6a}
.ty{display:inline-flex;padding:6px 12px;border-radius:999px;font:700 15px/1 var(--f-body);border:1px solid transparent;color:#fff}
.ty.black{background:#000;border-color:#6b6b6b}.ty.red{background:#c4161c;border-color:#ff6b6f}.ty.royal{background:#1d4ea8;border-color:#6f9bf0}.ty.tunnel{background:#5b3a1c;border-color:#b98a55}.ty.ho{background:#4a2a72;border-color:#9a72d0}
.pa-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.pa-img,.pa-mini{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);object-fit:contain;border-radius:10px}
.pa-mini .bg{fill:#17110d;stroke:rgba(255,255,255,.1);stroke-width:.4}.pa-mini .gr{stroke:rgba(255,255,255,.06);stroke-width:.3}
.pa-side{display:flex;flex-direction:column;gap:14px}
h4{margin:0 0 8px;font:600 13px var(--f-body);color:var(--brass);letter-spacing:0;text-transform:none}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.it{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;font:700 14px var(--f-body);color:#fff;border:1px solid rgba(255,255,255,.25)}
.it b{background:rgba(0,0,0,.35);border-radius:99px;padding:1px 7px;font-size:13.5px}
.it.solo{background:#a8283c}.it.grp{background:#9a5420}.it.raid{background:#7b45b8}.it.ho{background:#5a2b86}.it.mist{background:#1f7a62}
.it.gold{background:#c9a227;color:#1a1a1a}.it.blue{background:#1d6fd6}.it.green{background:#2e8b3d}
.it.none{background:var(--cloth-2);color:var(--parch-2);font-weight:600;padding:5px 12px}
.rec{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:start;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line-soft)}
.rec:last-child{border-bottom:0}
.rec img{width:24px;height:24px;margin-top:2px}
.rec .rt{display:flex;flex-direction:column;gap:6px;min-width:0}
.rec .rn{font:500 15px/1.2 var(--f-body);color:var(--parch)}
.rec .tt{display:flex;gap:5px;flex-wrap:wrap}
.zc{display:inline-flex;gap:4px;align-items:baseline;padding:2px 7px;border-radius:7px;background:var(--cloth-2);border:1px solid var(--line-soft);font-size:12px}.zc small{color:var(--smoke)}.zc b{color:var(--parch)}
.rq{font:700 15px/1 var(--f-body);color:#1a1208;background:var(--saffron);padding:5px 9px;border-radius:8px}
.vazio{padding:24px 8px;color:var(--smoke);text-align:center}
@media (max-width:760px){.pa-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="pa" role="dialog" aria-label="Mapa de Avalon">
 <div class="pa-bar" id="bar"><span aria-hidden="true">🗺</span><b>Albion Overlay · Mapa de Avalon</b><button id="x" title="Fechar (Esc)" aria-label="Fechar">✕</button></div>
 <div class="pa-corpo" id="c"><div class="vazio">Carregando o mapa…</div></div>
</div>
<script src="js/painel-avalon.js"></script>
</body></html>
